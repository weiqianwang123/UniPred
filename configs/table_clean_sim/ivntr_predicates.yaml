# IVNTR's tree search proposes many more effect vectors than the LLM, so it
# gets IVNTR's usual search budget; as in IVNTR, every vector that passes
# is kept for selection (no max_num_vectors).
include: predicates.yaml
defaults: {num_iter: 70, batch_vect_num: 4, matrix_vec_try: 100,
           search_tree_max_level: 3, max_num_vectors: null}
predicate_types:
  - {name: neural_u_box, max_num_vectors: null}
