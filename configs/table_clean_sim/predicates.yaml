# What UniPred knows and learns about Table Clean Sim (passed as
# --neupi_pred_config; see configs/satellites/predicates.yaml for the
# format).

description: >-
  A robot cleans a table: it puts every toy into a box, wipes the dirt off
  the table with a towel (the wiper) and puts the towel back into the box.
  It holds at most one object at a time. The box is on the near side of the
  table or on the far side. Wiping is not possible while a toy is on the
  table, because it would sweep the toy away, or while the box is on the
  near side, because it is in the way. The towel can only be taken from or
  put into the box while the box is on the near side.

known_predicates:
  - {name: ToyInBox, effects: {PlaceToyInBox: add}}
  - {name: TableClean, effects: {WipeTable: add}}
  - {name: WiperInBox, effects: {PickWiperFromBox: del, PlaceWiperInBox: add}}

defaults:
  architecture: {type: MLP, layer_size: 128, initializer: xavier}
  optimizer: {type: AdamW, kwargs: {lr: 0.001}}
  lr_scheduler: {type: StepLR, kwargs: {step_size: 50, gamma: 0.2}}
  batch_size: 512
  epochs: 100
  gumbel_temp: 0.7
  val_freq: 10
  guidance_thresh: 0.05
  loss_thresh: 0.005
  num_iter: 10
  batch_vect_num: 4
  matrix_vec_try: 20
  max_num_vectors: 1

predicate_types:
  - {name: neural_u_robot, types: [robot], ent_idx: [0]}
  - {name: neural_u_box, types: [box], ent_idx: [0], max_num_vectors: 2}
  - {name: neural_b_robot_toy, types: [robot, toy], ent_idx: [0, 0]}
  - {name: neural_b_robot_wiper, types: [robot, wiper], ent_idx: [0, 0]}
  - {name: neural_b_toy_table, types: [toy, table], ent_idx: [0, 0]}
