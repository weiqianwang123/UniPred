# Table Clean Sim: put every toy into the box, wipe the table and put the
# wiper back. Train with two toys from the standard start, test with three
# toys and unseen starts. The excluded predicates are hidden and must be
# invented; NoToyOnTable is derived (ForAll ?toy. Not ToyOnTable(?toy,
# ?table)).
env: table_clean_sim
excluded_predicates: HandEmpty,HoldingToy,HoldingWiper,ToyOnTable,BoxNear,BoxFar,NoToyOnTable
num_train_tasks: 50
num_test_tasks: 50
timeout: 10
# The atoms closure of the derived predicates needs A*.
sesame_task_planner: astar
execution_monitor: expected_atoms
# Skeletons refined before giving up (the fork's default is 8; Satellites
# has 50). Demonstrations always put the toys away before taking the wiper,
# so they cannot tell whether "no toy is on the table" is a precondition of
# taking the wiper or of wiping; a model that puts it on the former tries
# wiping first in tasks that start with the wiper in hand, and refinement
# rejects those skeletons. With 8, UniPred solved 34 of 50 test tasks, with
# 50, 46 (seed 0; 22 without derived-aware selection).
sesame_max_skeletons_optimized: 50
