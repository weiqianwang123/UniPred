# The real-robot setup used by examples/real_robot: perception for
# processing demonstrations, planning from images and the closed loop
# (see unipred/perception/scene.py).

# "groundingdino_sam2" (weights from scripts/install.sh) or "fake" (the
# synthetic fixture of examples/real_robot).
detector: groundingdino_sam2
# The crop encoder: "dinov3" (the paper's), "resnet18" or "fake".
encoder: dinov3
device: cuda
# GroundingDINO thresholds on box and text scores.
box_threshold: 0.35
text_threshold: 0.25
# A crop extends this fraction of the box's size beyond each side.
crop_padding: 0.15
# Black out the pixels outside the SAM2 mask in crops.
mask_crops: false
# The robot's camera ids; implementations of RobotInterface.capture() use
# the first one (examples/real_robot/closed_loop_example.py).
cameras: [0]
# The GroundingDINO text prompt of each object type.
prompts:
  robot: robot gripper
  toy: toy
  box: box
  wiper: towel
  table: table
