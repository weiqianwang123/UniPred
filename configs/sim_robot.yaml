# The simulated robot (unipred/robot_sim, Table Clean in MuJoCo): perception
# for processing its recordings (examples/real_robot/collect_sim_demos.py),
# planning from its images and the closed loop on it. As
# configs/real_robot.yaml, with prompts for the simulator's objects.

# "sam3" (a SAM3 server, CDG's; unipred/perception/sam3.py),
# "groundingdino_sam2" (weights from scripts/install.sh) or "fake".
detector: sam3
# The crop encoder: "dinov3" (the paper's), "resnet18", "auto" (DINOv3 if
# its weights are installed, else ResNet-18) or "fake".
encoder: dinov3
device: cuda
# Thresholds on box and text scores (SAM3 has scores only, and drops
# those below 0.3).
box_threshold: 0.3
text_threshold: 0.25
# A crop extends this fraction of the box's size beyond each side.
crop_padding: 0.15
# Black out the pixels outside the detected mask in crops.
mask_crops: false
cameras: [0]
# The text prompts of each object type: the Franka (the whole arm, its
# gripper and what it holds in the crop; "robot" alone also matches the
# toys that are robot figures, which then lose to it), the scanned toys,
# the wooden tray (the box), the sponge (the wiper) and the table. A
# detection that overlaps a better one of another type is dropped (SAM3
# also takes the arm, the tray and the sponge for toys). On 255 images
# (every second keyframe of 60 sessions): every tray and table, 250 of 255
# sponges, 512 of 515 toys and 247 of 255 robots.
prompts:
  robot: robotic arm
  toy: toy
  box: wooden tray
  wiper: purple sponge
  table: table
# A toy's box is at most 0.6 percent of the image in the 60 recorded
# sessions; SAM3's "toy" around the arm holding the sponge (12 percent,
# scored above "robotic arm") would otherwise drop the arm.
max_box_area:
  toy: 0.02
# The toys are followed from keyframe to keyframe through the frames
# recorded during the skills, with SAM3's video tracker (on the SAM3
# server): in the next keyframe, a toy is the detection whose mask overlaps
# its followed mask by at least track_min_iou (IoU), or the followed mask.
# A held toy's box is then right in 100 of 103 keyframes, against 84
# without tracking (docs/dev/decisions.md).
tracker: sam3
track_types: [toy]
track_min_iou: 0.3
# The features also give each object's box in the image (where a toy is:
# on the table, in the tray), see configs/real_robot.yaml.
box_features: true
