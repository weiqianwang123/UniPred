# Grammar baseline (Table II): predicates proposed by a predefined grammar
# over the object features and selected by planning effort, with
# operators learned by clustering and intersection (IVNTR's belief-based
# learner needs the effect vectors that only neural invention provides).
# The selection is scored on 20 demonstrations with a 0.1 s planning
# budget each and at most 50 grammar predicates, so that a run finishes in
# minutes instead of days.
include: base.yaml
approach: grammar_search_invention
strips_learner: cluster_and_intersect
grammar_search_max_predicates: 50
grammar_search_max_demos: 20
grammar_search_task_planning_timeout: 0.1
