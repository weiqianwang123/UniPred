# IVNTR on Blocks: the predicate types of predicates.yaml with IVNTR's
# search budget (its tree search proposes many more effect vectors than
# the LLM does). As in IVNTR, every vector that passes is kept for
# selection (no max_num_vectors).
include: predicates.yaml
defaults: {matrix_vec_try: 100, search_tree_max_level: 3,
           max_num_vectors: null}
predicate_types:
  - {name: neural_u_p1, batch_vect_num: 12, max_num_vectors: null}
  - {name: neural_u_p2, batch_vect_num: 12, max_num_vectors: null}
  - {name: neural_u_p3, batch_vect_num: 12, max_num_vectors: null}
  - {name: neural_b_p4, num_iter: 70, max_num_vectors: null}
  - {name: neural_b_p5, num_iter: 70, max_num_vectors: null}
  - {name: neural_b_p6, num_iter: 70, max_num_vectors: null}
  - {name: neural_b_p7, num_iter: 70, max_num_vectors: null}
