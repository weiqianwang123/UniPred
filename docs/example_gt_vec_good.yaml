# IVNTR predicate config for docs/04_bilevel_learning.ipynb: the
# Satellites predicate types, each with a given effect vector (gt: one
# code per option, in sorted order: 0 no effect, 1 add, 2 delete), used
# with --neupi_gt_ae_matrix True. See load_predicate_config in
# predicators/approaches/bilevel_learning_approach.py.
final_options: [UseCamera, UseGeiger, UseInfraRed]
static_predicates: [CalibrationTarget, HasCamera, HasInfrared, HasGeiger, ShootsChemX,
  ShootsChemY]
predicate_types:
- name: neural_u_p1
  types: [satellite]
  gt:
  - [1, 0, 0, 0, 0, 0, 0, 0]
  ent_idx: [0]
  architecture: {type: MLP, layer_size: 32, initializer: xavier}
  optimizer:
    type: AdamW
    kwargs: {lr: 0.001}
  lr_scheduler:
    type: StepLR
    kwargs: {step_size: 70, gamma: 0.1}
  batch_vect_num: 12
  batch_size: 512
  epochs: 100
  gumbel_temp: 0.66
  val_freq: 10
  num_iter: 5
  matrix_vec_try: 100
  search_tree_max_level: 1
  guidance_thresh: 0.05
  loss_thresh: 0.005
  skip_train: false
