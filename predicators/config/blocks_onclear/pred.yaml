# IVNTR predicate config for Blocks (blocks_onclear; see
# load_predicate_config in predicators/approaches/bilevel_learning_approach.py).
final_options: [AchieveGoal]
defaults:
  optimizer:
    type: AdamW
    kwargs: {lr: 0.001}
  lr_scheduler:
    type: StepLR
    kwargs: {step_size: 70, gamma: 0.1}
  batch_size: 512
  gumbel_temp: 0.66
  val_freq: 10
  matrix_vec_try: 100
  guidance_thresh: 0.01
  loss_thresh: 0.005
predicate_types:
- name: neural_u_p1
  types: [robot]
  ent_idx: [0]
  architecture: {type: MLP, layer_size: 32, initializer: xavier}
  batch_vect_num: 12
  epochs: 100
  num_iter: 5
  search_tree_max_level: 3
- name: neural_u_p2
  types: [block]
  ent_idx: [0]
  architecture: {type: MLP, layer_size: 32, initializer: xavier}
  batch_vect_num: 12
  epochs: 100
  num_iter: 5
  search_tree_max_level: 3
- name: neural_u_p3
  types: [block]
  ent_idx: [1]
  architecture: {type: MLP, layer_size: 32, initializer: xavier}
  batch_vect_num: 12
  epochs: 100
  num_iter: 5
  search_tree_max_level: 3
- name: neural_b_p4
  types: [block, block]
  ent_idx: [0, 1]
  architecture: {type: MLP, layer_size: 128, initializer: xavier}
  batch_vect_num: 4
  epochs: 200
  num_iter: 70
- name: neural_b_p5
  types: [block, block]
  ent_idx: [1, 0]
  architecture: {type: MLP, layer_size: 128, initializer: xavier}
  batch_vect_num: 4
  epochs: 200
  num_iter: 70
- name: neural_b_p6
  types: [robot, block]
  ent_idx: [0, 0]
  architecture: {type: MLP, layer_size: 128, initializer: xavier}
  batch_vect_num: 4
  epochs: 200
  num_iter: 70
  search_tree_max_level: 3
- name: neural_b_p7
  types: [robot, block]
  ent_idx: [0, 1]
  architecture: {type: MLP, layer_size: 128, initializer: xavier}
  batch_vect_num: 4
  epochs: 200
  num_iter: 70
  search_tree_max_level: 3
