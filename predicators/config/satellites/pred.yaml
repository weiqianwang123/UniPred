# IVNTR predicate config for Satellites (see load_predicate_config in
# predicators/approaches/bilevel_learning_approach.py).
final_options: [UseCamera, UseGeiger, UseInfraRed]
static_predicates: [CalibrationTarget, HasCamera, HasInfrared, HasGeiger, ShootsChemX,
  ShootsChemY]
defaults:
  optimizer:
    type: AdamW
    kwargs: {lr: 0.001}
  lr_scheduler:
    type: StepLR
    kwargs: {step_size: 70, gamma: 0.1}
  batch_size: 512
  gumbel_temp: 0.66
  val_freq: 10
  matrix_vec_try: 100
  loss_thresh: 0.005
predicate_types:
- name: neural_u_p1
  types: [satellite]
  ent_idx: [0]
  architecture: {type: MLP, layer_size: 32, initializer: xavier}
  batch_vect_num: 12
  epochs: 100
  num_iter: 5
  guidance_thresh: 0.05
- name: neural_u_p2
  types: [object]
  ent_idx: [0]
  architecture: {type: MLP, layer_size: 32, initializer: xavier}
  batch_vect_num: 12
  epochs: 100
  num_iter: 5
  guidance_thresh: 0.05
- name: neural_b_p3
  types: [satellite, object]
  ent_idx: [0, 0]
  architecture: {type: MLP, layer_size: 128, initializer: xavier}
  batch_vect_num: 4
  epochs: 200
  num_iter: 70
  guidance_thresh: 0.1
- name: neural_b_p4
  types: [object, satellite]
  ent_idx: [0, 0]
  architecture: {type: MLP, layer_size: 128, initializer: xavier}
  batch_vect_num: 4
  epochs: 200
  num_iter: 70
  guidance_thresh: 0.1
