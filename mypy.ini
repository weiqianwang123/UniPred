[mypy]
strict_equality = True
disallow_untyped_calls = True
warn_unreachable = True
exclude = (venv)

[mypy-predicators.*]
disallow_untyped_defs = True

[mypy-scripts.*]
disallow_untyped_defs = True

[mypy-predicators.tests.*]
ignore_missing_imports = True

[mypy-predicators.third_party.*]
ignore_missing_imports = True
ignore_errors = True

[mypy-setuptools.*]
ignore_missing_imports = True

[mypy-gym.spaces.*]
ignore_missing_imports = True

[mypy-imageio.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-tabulate.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-dill.*]
ignore_missing_imports = True

[mypy-pyperplan.*]
ignore_missing_imports = True

[mypy-pathos.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-gym.*]
ignore_missing_imports = True
